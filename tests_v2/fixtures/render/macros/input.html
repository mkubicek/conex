<h2>Code</h2>
<ac:structured-macro ac:name="code"><ac:parameter ac:name="language">python</ac:parameter><ac:plain-text-body><![CDATA[def hello():
    return "world"]]></ac:plain-text-body></ac:structured-macro>
<h2>Panels</h2>
<ac:structured-macro ac:name="info"><ac:rich-text-body><p>Informational note.</p></ac:rich-text-body></ac:structured-macro>
<ac:structured-macro ac:name="warning"><ac:rich-text-body><p>Careful <strong>here</strong>.</p></ac:rich-text-body></ac:structured-macro>
<h2>Expand</h2>
<ac:structured-macro ac:name="expand"><ac:parameter ac:name="title">More details</ac:parameter><ac:rich-text-body><p>Hidden content with a <a href="https://example.com">link</a>.</p></ac:rich-text-body></ac:structured-macro>
<h2>Status and Jira</h2>
<p>Current state: <ac:structured-macro ac:name="status"><ac:parameter ac:name="colour">Green</ac:parameter><ac:parameter ac:name="title">ON TRACK</ac:parameter></ac:structured-macro></p>
<p>Tracked in <ac:structured-macro ac:name="jira"><ac:parameter ac:name="key">CONEX-42</ac:parameter></ac:structured-macro>.</p>
<h2>TOC</h2>
<ac:structured-macro ac:name="toc"><ac:parameter ac:name="maxLevel">2</ac:parameter></ac:structured-macro>
<h2>Unknown macro falls through to the default handler</h2>
<ac:structured-macro ac:name="fancy-widget"><ac:parameter ac:name="mode">full</ac:parameter><ac:rich-text-body><p>Widget body survives.</p></ac:rich-text-body></ac:structured-macro>
